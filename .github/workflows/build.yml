name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Add chess.js
        run: |
          curl -sL https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js -o chess.js
          python3 -c "p='app/src/main/assets/index.html';s=open(p).read();open(p,'w').write(s.replace('/*CHESSJS*/',open('chess.js').read()))"
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: juligram-chess-apk
          path: app/build/outputs/apk/debug/app-debug.apk
